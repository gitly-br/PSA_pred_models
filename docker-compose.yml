

services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  sentry:
    build:
      context: ./backend/sentry
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    environment:
      - NODE_ENV=local

  harvest:
    build:
      context: ./backend/harvest
    env_file:
      - ./backend/harvest/.env
    depends_on:
      - mongo

  floodcast:
    build:
      context: ./backend/floodcast
    env_file:
      - ./backend/floodcast/.env
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    env_file:
      - ./frontend/.env
    depends_on:
      - sentry

volumes:
  mongo-data:
