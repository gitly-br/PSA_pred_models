services:
  mongo:
    image: mongo:8.2
    init: true
    ports:
      - "27000:27017"
    volumes:
      - models_mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=psa
      - MONGO_INITDB_ROOT_PASSWORD=psa
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGO_GITLY_CONNECTION_STRING=mongodb://psa:psa@mongo:27017/?authSource=admin
      - MONGO_GITLY_VERSION_SCHEMA=1
      - MONGO_URI=mongodb://psa:psa@mongo:27017/?authSource=admin
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - NODE_ENV=local
    ports:
      - "8080:8080"
      - "6457:6457"
    command: ./entrypoint.sh
    networks:
      - app_network
      - support_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - API_URL=http://backend:8080
    volumes:
      - ./frontend:/app
    ports:
      - "8501:8501"
    networks:
      - app_network

networks:
  app_network:
  support_network:

volumes:
  models_mongo_data:
