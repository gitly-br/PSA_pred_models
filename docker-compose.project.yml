services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: psa
      MINIO_ROOT_PASSWORD: psa12345
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - project_minio_data:/data
    networks:
      - psa_network

  mongo:
    image: mongo:7.0
    init: true
    ports:
      - "16521:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: psa
      MONGO_INITDB_ROOT_PASSWORD: psa
    volumes:
      - project_mongo_data:/data/db
    networks:
      - psa_network

networks:
  psa_network:

volumes:
  project_minio_data:
  project_mongo_data:
