services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: psa
      MINIO_ROOT_PASSWORD: psa12345
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - project_minio_data:/data
    networks:
      - psa_network

  mongo:
    image: mongo:7.0
    init: true
    ports:
      - "16521:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: psa
      MONGO_INITDB_ROOT_PASSWORD: psa
    volumes:
      - project_mongo_data:/data/db
    networks:
      - psa_network

  floodcast:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: []
    working_dir: /workspace/backend
    environment:
      MONGO_URI: mongodb://psa:psa@mongo:27017/?authSource=admin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: psa
      MINIO_SECRET_KEY: psa12345
      MINIO_BUCKET: psa
      MINIO_SECURE: "false"
      PYTHONPATH: /workspace/backend/floodcast
    volumes:
      - ./:/workspace
    depends_on:
      - minio
      - mongo
    networks:
      - psa_network

  sentry:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: []
    working_dir: /workspace/backend/sentry
    command: ["python", "source/run.py", "--env", "local"]
    environment:
      MONGO_URI: mongodb://psa:psa@mongo:27017/?authSource=admin
      MONGO_GITLY_CONNECTION_STRING: mongodb://psa:psa@mongo:27017/?authSource=admin
      MONGO_GITLY_VERSION_SCHEMA: "1"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: psa
      MINIO_SECRET_KEY: psa12345
      MINIO_BUCKET: psa
      MINIO_SECURE: "false"
      PYTHONPATH: /workspace/backend/floodcast:/workspace/backend/harvest:/workspace/backend/sentry/source
    volumes:
      - ./:/workspace
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    networks:
      - psa_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_URL: http://sentry:8080
    depends_on:
      - sentry
    ports:
      - "8501:8501"
    networks:
      - psa_network

networks:
  psa_network:

volumes:
  project_minio_data:
  project_mongo_data:
