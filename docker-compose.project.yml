services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: psa
      MINIO_ROOT_PASSWORD: psa12345
    ports:
      - "19002:9000"
      - "19003:9001"
    volumes:
      - project_minio_data:/data
    networks:
      - psa_network

  mongo:
    image: mongo:7.0
    init: true
    ports:
      - "16522:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: psa
      MONGO_INITDB_ROOT_PASSWORD: psa
    volumes:
      - project_mongo_data:/data/db
    networks:
      - psa_network

  floodcast:
    build:
      context: ./worktrees/integrate-flood-watch-hub/backend
      dockerfile: Dockerfile
    entrypoint: []
    working_dir: /workspace/backend
    environment:
      MONGO_URI: mongodb://psa:psa@mongo:27017/?authSource=admin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: psa
      MINIO_SECRET_KEY: psa12345
      MINIO_BUCKET: psa
      MINIO_SECURE: "false"
      PYTHONPATH: /workspace/backend/floodcast
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_EXPLANATION_MODEL: ${OPENROUTER_EXPLANATION_MODEL:-google/gemini-2.5-flash-lite}
      OPENROUTER_EXPLANATION_TIMEOUT_SECONDS: ${OPENROUTER_EXPLANATION_TIMEOUT_SECONDS:-8.0}
    volumes:
      - ./worktrees/integrate-flood-watch-hub:/workspace
    depends_on:
      - minio
      - mongo
    networks:
      - psa_network

  sentry:
    build:
      context: ./worktrees/integrate-flood-watch-hub/backend
      dockerfile: Dockerfile
    entrypoint: []
    working_dir: /workspace/backend/sentry
    command: ["python", "source/run.py", "--env", "local"]
    environment:
      MONGO_URI: mongodb://psa:psa@host.docker.internal:16521/?authSource=admin
      MONGO_GITLY_CONNECTION_STRING: mongodb://psa:psa@host.docker.internal:16521/?authSource=admin
      MONGO_GITLY_VERSION_SCHEMA: "1"
      MINIO_ENDPOINT: host.docker.internal:19000
      MINIO_ACCESS_KEY: psa
      MINIO_SECRET_KEY: psa12345
      MINIO_BUCKET: psa
      MINIO_SECURE: "false"
      PYTHONPATH: /workspace/backend/floodcast:/workspace/backend/harvest:/workspace/backend/sentry/source
    volumes:
      - ./worktrees/integrate-flood-watch-hub:/workspace
    depends_on:
      - mongo
    ports:
      - "8082:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - psa_network

  frontend:
    build:
